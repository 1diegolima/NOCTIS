name: Build iOS IPA (Free Personal Sideloading)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: ⚙️ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 💎 Ruby + CocoaPods estável
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Instalar Dependências JS
        run: npm install --legacy-peer-deps

      - name: 🔨 Expo Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive
        env:
          CI: 1

      - name: 🍎 CocoaPods install
        run: |
          gem install cocoapods --no-document
          cd ios
          pod install
          cd ..

      - name: 🔗 Resolver Swift Package Dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -derivedDataPath "$PWD/DerivedData"

      - name: 🏗️ Build (sem assinatura)
        run: |
          xcodebuild \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERROS ==="
            grep -E "error:" build_log.txt | grep -v "^note:" | head -60
            exit $BUILD_EXIT
          fi

      - name: 📋 Upload log (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 3

      - name: 📂 Localizar .app
        id: find_app
        run: |
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d \
            | grep -v "\.appex" \
            | grep "Release-iphoneos" \
            | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep -v "\.appex" | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "App: $APP_PATH"

      - name: 📦 Empacotar NOCTIS.ipa
        run: |
          mkdir -p Payload
          cp -r "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r NOCTIS.ipa Payload
          ls -lh NOCTIS.ipa

      - name: 🚀 Upload NOCTIS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: NOCTIS-iOS-IPA
          path: NOCTIS.ipa
          retention-days: 14
