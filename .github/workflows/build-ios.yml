name: Build iOS IPA (Free Personal Sideloading)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: ⚙️ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Dependências JS
        run: npm install --legacy-peer-deps

      - name: 🔨 Expo Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive
        env:
          CI: 1

      - name: 🔧 Patch Podfile (deployment target + C++ standard)
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          # Patch pós-instalação: corrige deployment target e C++ standard
          # para compatibilidade com React Native 0.76+ e Xcode 16
          fix = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                # React Native 0.76+ requer iOS 15.1 no mínimo
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                # C++17 é mais compatível com Xcode 16 que C++20
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'gnu++17'
              end
            end
          """

          if 'post_install do |installer|' in content:
              patched = content.replace(
                  'post_install do |installer|',
                  'post_install do |installer|\n' + fix,
                  1
              )
          else:
              patched = content + '\npost_install do |installer|\n' + fix + '\nend\n'

          with open('ios/Podfile', 'w') as f:
              f.write(patched)

          print('✅ Podfile patcheado!')
          PYEOF

      - name: 💎 Instalar xcpretty
        run: gem install xcpretty --no-document

      - name: 🍎 CocoaPods install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔗 Resolver Swift Package Dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -derivedDataPath "$PWD/DerivedData"

      - name: 🏗️ Build (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build_log.txt | xcpretty --color

      - name: ❌ Mostrar erros (só se falhar)
        if: failure()
        run: |
          echo "========================================="
          echo "ERROS DO BUILD:"
          echo "========================================="
          grep -E "^\s*(error:|fatal error:)" build_log.txt | head -80 || true
          echo "-----------------------------------------"
          echo "ÚLTIMAS 50 LINHAS DO LOG:"
          echo "-----------------------------------------"
          tail -n 50 build_log.txt || true

      - name: 📋 Upload log completo (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 3

      - name: 📂 Localizar .app
        id: find_app
        run: |
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d \
            | grep -v "\.appex" \
            | grep "Release-iphoneos" \
            | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep -v "\.appex" | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "App: $APP_PATH"

      - name: 📦 Empacotar NOCTIS.ipa
        run: |
          mkdir -p Payload
          cp -r "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r NOCTIS.ipa Payload
          ls -lh NOCTIS.ipa

      - name: 🚀 Upload NOCTIS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: NOCTIS-iOS-IPA
          path: NOCTIS.ipa
          retention-days: 14
