name: Build iOS IPA (Free Personal Sideloading)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: ⚙️ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Dependências JS
        run: npm install --legacy-peer-deps

      - name: 🔧 Fix RuntimeScheduler.h — SWIFT_RETURNS_RETAINED em construtores é inválido
        run: |
          FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          # SWIFT_RETURNS_RETAINED só é válido em funções que retornam ponteiros SWIFT_SHARED_REFERENCE.
          # Construtores C++ não "retornam" nada — o Xcode 16 rejeita a anotação com erro.
          # A classe continua sendo SWIFT_SHARED_REFERENCE (linha 90), o ARC funciona corretamente.
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' "$FILE"
          echo "✅ RuntimeScheduler.h patcheado!"
          grep -n "SWIFT_RETURNS" "$FILE" && echo "⚠️ Ainda há anotações SWIFT_RETURNS" || echo "✅ Nenhum SWIFT_RETURNS_RETAINED nos construtores"

      - name: 🔇 Remove -quiet do inner build (melhor visibilidade de erros)
        run: |
          SCRIPT="node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh"
          sed -i '' 's/    -quiet \\//' "$SCRIPT"
          echo "✅ -quiet removido do build script"

      - name: 🔨 Expo Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive
        env:
          CI: 1

      - name: 🔧 Patch Podfile (deployment target)
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          fix = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
              end
            end
          """

          if 'post_install do |installer|' in content:
              patched = content.replace(
                  'post_install do |installer|',
                  'post_install do |installer|\n' + fix,
                  1
              )
          else:
              patched = content + '\npost_install do |installer|\n' + fix + '\nend\n'

          with open('ios/Podfile', 'w') as f:
              f.write(patched)
          print('✅ Podfile patcheado!')
          PYEOF

      - name: 💎 Instalar xcpretty
        run: gem install xcpretty --no-document

      - name: 🍎 CocoaPods install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔗 Resolver Swift Package Dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -derivedDataPath "$PWD/DerivedData"

      - name: 🏗️ Build (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build_log.txt | xcpretty --color

      - name: ❌ Mostrar erros (só se falhar)
        if: failure()
        run: |
          echo "========================================="
          echo "ERROS DO BUILD:"
          echo "========================================="
          grep -iE "(error:|fatal error:)" build_log.txt | grep -v "^note:" | head -100 || true
          echo "-----------------------------------------"
          echo "ÚLTIMAS 80 LINHAS:"
          echo "-----------------------------------------"
          tail -n 80 build_log.txt || true

      - name: 📋 Upload log (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 3

      - name: 📂 Localizar .app
        id: find_app
        run: |
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d \
            | grep -v "\.appex" \
            | grep "Release-iphoneos" \
            | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep -v "\.appex" | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "App: $APP_PATH"

      - name: 📦 Empacotar NOCTIS.ipa
        run: |
          mkdir -p Payload
          cp -r "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r NOCTIS.ipa Payload
          ls -lh NOCTIS.ipa

      - name: 🚀 Upload NOCTIS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: NOCTIS-iOS-IPA
          path: NOCTIS.ipa
          retention-days: 14
