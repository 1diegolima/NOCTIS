name: Build iOS IPA (Free Personal Sideloading)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Xcode 16+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências do Projeto
        run: npm install --legacy-peer-deps

      - name: 🔨 Gerar Projeto Nativo iOS (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 Instalar CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 🏗️ Compilar App Nativo (.app)
        run: |
          xcodebuild -workspace ios/NOCTIS.xcworkspace \
            -scheme NOCTIS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 📦 Empacotar como NOCTIS.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "NOCTIS.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "App path: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r NOCTIS.ipa Payload

      - name: 🚀 Disponibilizar NOCTIS.ipa para Download
        uses: actions/upload-artifact@v4
        with:
          name: NOCTIS-iOS-IPA
          path: NOCTIS.ipa
          retention-days: 14
